# GoReleaser config. Cut a release locally: see DEVELOPMENT.md "Releasing".
# Validate after edits with `goreleaser check`.
version: 2

project_name: vault-search

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Version is canonical in main.go (var version); the tag overrides it here.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# macOS-only cask, pushed to the personal tap. Binaries are unsigned, so the
# post-install hook strips the quarantine attribute that would otherwise block
# the first run. Linux users install via `go install` instead (no cask).
homebrew_casks:
  - name: vault-search
    repository:
      owner: eitanpo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/eitanpo/vault-search"
    description: "Thin CLI over an obsidian-hybrid-search serve daemon for concurrent vault search"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vault-search"]
          end
